<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Plan Generator</title>
  <meta name="description" content="Build a weekly workout plan from your goals, schedule and equipment, then log your sessions.">
  <meta name="theme-color" content="#fafaf9">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><rect x='6' y='13' width='20' height='6' rx='2' fill='white'/><rect x='4' y='10' width='4' height='12' rx='1.5' fill='white'/><rect x='24' y='10' width='4' height='12' rx='1.5' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Workout</div>
      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-view="build">Build</button>
        <button data-view="plan">Plan</button>
        <button data-view="log">Log</button>
        <button data-view="history">History</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
